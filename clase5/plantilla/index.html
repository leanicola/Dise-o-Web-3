<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
</head>

<body>
    <header class="hero">
        <h1>Contacto</h1>
    </header>
    <main class="contenedor">
<form action="https://formsubmit.co/leandronicolaburguez@gmail.com" method="POST">

    <div class="fila">
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required placeholder="John">
        </div>

        <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required placeholder="Doe">
        </div>
    </div>

    <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="johndoe@example.com">
    </div>

    <div class="campo">
        <label for="mensaje">Mensaje</label>
        <textarea
            id="mensaje"
            name="mensaje"
            placeholder="Cuentanos lo que quieras"
        ></textarea>
    </div>

    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://yourdomain.co/thanks.html">

    <div class="form-footer">
        <label class="terminos">
            <input type="checkbox" id="terminos" required>
            <span>Acepto los términos y condiciones</span>
        </label>

        <button type="submit">Enviar</button>
    </div>

</form>
    </main>
</body>

</html>
